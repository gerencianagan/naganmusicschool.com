<link rel="canonical" href="https://naganmusicschool.com/inscripcion">

<style>
  :root{
    --navy:#1B2A4A;
    --navy-soft:#2C3F66;
    --paper:#FBFBF9;
    --ink:#1A1A1A;
    --muted:#6B7280;
    --line:#E3E5E9;
  }

  *{box-sizing:border-box;}

  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .bar{
    background:var(--navy);
    padding:18px 24px;
    text-align:center;
  }

  .bar img{
    height:40px;
    width:auto;
    display:inline-block;
    vertical-align:middle;
  }

  .intro{
    max-width:640px;
    margin:0 auto;
    padding:44px 24px 28px;
    text-align:center;
  }

  .intro h1{
    margin:0 0 14px;
    font-size:30px;
    line-height:1.2;
    font-weight:600;
    letter-spacing:-0.015em;
    color:var(--navy);
  }

  .intro p{
    margin:0 auto;
    max-width:46ch;
    color:var(--muted);
    font-size:16.5px;
  }

  .form-wrap{
    max-width:820px;
    margin:0 auto 56px;
    padding:0 16px;
  }

  .form-wrap iframe{
    width:100%;
    height:1500px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
  }

  .fallback{
    max-width:640px;
    margin:0 auto 56px;
    padding:0 24px;
    text-align:center;
    font-size:15.5px;
    color:var(--muted);
  }

  .fallback a{color:var(--navy-soft);}

  footer{
    border-top:1px solid var(--line);
    padding:26px 24px 34px;
    text-align:center;
    font-size:14.5px;
    color:var(--muted);
  }

  footer a{
    color:var(--navy-soft);
    text-decoration:none;
    border-bottom:1px solid var(--line);
  }

  footer a:hover,footer a:focus{border-bottom-color:var(--navy-soft);}

  a:focus-visible{outline:2px solid var(--navy-soft);outline-offset:3px;}

  @media (max-width:600px){
    .intro{padding:32px 20px 22px;}
    .intro h1{font-size:25px;}
    .form-wrap iframe{height:1750px;border-radius:0;border-left:none;border-right:none;}
    .form-wrap{padding:0;}
  }
</style>
</head>
<body>

<div class="bar">
  <a href="/"><img src="/img/logo.png" alt="Nagan Music School"></a>
</div>

<section class="intro">
  <h1>Solicitud de inscripción</h1>
  <p>Completa el formulario y te contactamos por WhatsApp para terminar el proceso. Toma menos de 3 minutos.</p>
</section>

<div class="form-wrap">
  <iframe
    src="https://airtable.com/embed/apphsT0Mw9Q7TXjgE/pagISKpX5D8V0krUM/form"
    title="Formulario de inscripción de Nagan Music School"
    loading="lazy">
  </iframe>
</div>

<p class="fallback">
  ¿No carga el formulario?
  <a href="https://airtable.com/apphsT0Mw9Q7TXjgE/pagISKpX5D8V0krUM/form">Ábrelo en una ventana nueva</a>.
</p>

<footer>
  Jardines del Valle, frente a Villas Palermo · San Pedro Sula, Honduras<br>
  ¿Tienes dudas? <a href="https://wa.me/50498267794?text=Hola,%20tengo%20una%20duda%20sobre%20la%20inscripci%C3%B3n">Escríbenos por WhatsApp</a>
</footer>

</body>
</html>
