<style>
:root{
  --noche:#05122E;
  --azul:#0C2450;
  --azul-2:#143A78;
  --azul-luz:#3A7BD5;
  --oro:#FFD84D;
  --oro-2:#FFC300;
  --blanco:#F2F7FF;
  --tenue:rgba(242,247,255,.66);
  --sutil:rgba(242,247,255,.38);
  --borde:rgba(120,170,255,.22);
  --ok:#4FD18B;
  --alerta:#FF8A6B;
  --seat:22px;
  --seat-gap:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:'Calibri Light','Calibri','Segoe UI',system-ui,-apple-system,sans-serif;
  font-weight:300;color:var(--blanco);line-height:1.55;
  background:var(--noche);min-height:100vh;overflow-x:hidden;
}
/* cielo */
.cielo{position:fixed;inset:0;z-index:0;pointer-events:none}
.cielo::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(120% 80% at 72% 8%, rgba(120,180,255,.30), transparent 55%),
    radial-gradient(90% 60% at 12% 0%, rgba(255,216,77,.10), transparent 60%),
    linear-gradient(180deg,#06183C 0%,#05122E 42%,#040D22 100%);
}
.cielo::after{
  content:'';position:absolute;inset:0;opacity:.55;
  background-image:
    radial-gradient(1.2px 1.2px at 20% 12%, #fff, transparent),
    radial-gradient(1px 1px at 68% 22%, #cfe4ff, transparent),
    radial-gradient(1.4px 1.4px at 84% 9%, #fff, transparent),
    radial-gradient(1px 1px at 38% 34%, #dceaff, transparent),
    radial-gradient(1px 1px at 8% 48%, #fff, transparent),
    radial-gradient(1.3px 1.3px at 92% 40%, #fff, transparent),
    radial-gradient(1px 1px at 55% 6%, #bcd8ff, transparent),
    radial-gradient(1px 1px at 30% 66%, #fff, transparent);
  background-repeat:no-repeat;
}
.lucero{
  position:fixed;top:4vh;right:8vw;width:min(230px,46vw);aspect-ratio:1;z-index:0;pointer-events:none;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(190,220,255,.5) 9%, rgba(120,175,255,.18) 26%, transparent 62%);
}
.lucero::before,.lucero::after{
  content:'';position:absolute;inset:0;margin:auto;
  background:linear-gradient(to bottom, transparent, rgba(255,255,255,.75), transparent);
}
.lucero::before{width:1.5px;height:100%}
.lucero::after{height:1.5px;width:100%;background:linear-gradient(to right, transparent, rgba(255,255,255,.75), transparent)}
#root{position:relative;z-index:1}

.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
.wrap-sm{max-width:640px;margin:0 auto;padding:0 22px}

h1,h2,h3{font-weight:400;letter-spacing:0}
.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
.display{font-family:'Playfair Display',Georgia,serif;font-size:clamp(3rem,13vw,6.4rem);line-height:.92;letter-spacing:-.01em}
.display em{font-style:italic;color:var(--oro)}
.lead{color:var(--tenue);max-width:54ch}
.meta{font-size:.93rem;color:var(--tenue)}
.tiny{font-size:.8rem;color:var(--sutil)}
.oro{color:var(--oro)}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0}
.logo{height:34px;width:auto;opacity:.95}
.logo-sm{height:26px}

/* botones */
button,a.btn{font-family:inherit;font-weight:300;cursor:pointer;border:none;background:none;color:inherit;text-decoration:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 30px;border-radius:100px;font-size:1.02rem;
  background:linear-gradient(180deg,var(--oro),var(--oro-2));color:#201800;
  box-shadow:0 6px 26px rgba(255,200,60,.24);
  transition:transform .14s ease, box-shadow .2s ease, filter .2s ease;
}
.btn:hover{filter:brightness(1.06);box-shadow:0 8px 32px rgba(255,200,60,.34)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:rgba(255,255,255,.1);color:var(--sutil);box-shadow:none;cursor:not-allowed}
.btn-pago{background:linear-gradient(180deg,#2FBF6B,#1FA855);color:#06240F;
  box-shadow:0 6px 26px rgba(47,191,107,.3);width:100%;padding:17px 30px;font-size:1.08rem}
.btn-pago:hover{filter:brightness(1.07);box-shadow:0 8px 32px rgba(47,191,107,.42)}
.btn-fantasma{background:rgba(255,255,255,.07);color:var(--blanco);border:1px solid var(--borde);box-shadow:none;backdrop-filter:blur(6px)}
.btn-fantasma:hover{background:rgba(255,255,255,.13);filter:none;box-shadow:none}
.btn-txt{color:var(--tenue);font-size:.92rem;padding:6px 2px;border-bottom:1px solid transparent}
.btn-txt:hover{color:var(--oro);border-bottom-color:var(--oro)}
.btn-mini{padding:7px 14px;font-size:.83rem;border-radius:100px;border:1px solid var(--borde);color:var(--tenue);background:rgba(255,255,255,.04)}
.btn-mini:hover{border-color:var(--oro);color:var(--oro)}
.btn-mini.on{border-color:var(--oro);color:#201800;background:var(--oro)}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px}

/* hero */
.hero{padding:clamp(30px,7vw,64px) 0 clamp(44px,8vw,80px)}
.hero.centro{text-align:center;display:flex;flex-direction:column;align-items:center}
.hero.centro .lead{margin-left:auto;margin-right:auto}
.logo-hero{height:clamp(74px,15vw,124px);width:auto;display:block;margin:0 auto clamp(22px,4vw,34px);opacity:.97}
.kicker{font-family:'Playfair Display',serif;font-style:italic;font-size:1.15rem;color:var(--blanco);opacity:.85;margin-bottom:6px}

   2 · ALMACENAMIENTO
   ═══════════════════════════════════════════════════════════ */
const Store = (()=>{
  let db=null, mem={}, oyentes=[], contador=0;
  const LLAVE="belen_local_"+CONFIG.nodo;
  /* En modo local intentamos conservar los datos en el navegador.
     Si el entorno lo bloquea (vistas previas aisladas), sigue funcionando en memoria. */
  const leerLocal=()=>{ try{
    const g=JSON.parse(localStorage.getItem(LLAVE)||"null");
    if(g){ mem=g.asientos||{}; contador=g.contador||0; }
  }catch(e){} };
  const guardarLocal=()=>{ try{
    localStorage.setItem(LLAVE,JSON.stringify({asientos:mem,contador}));
  }catch(e){} };
  try{ if(CONFIG.firebase.databaseURL){ firebase.initializeApp(CONFIG.firebase); db=firebase.database(); } }
  catch(e){ console.warn("Firebase no disponible; modo local.", e.message); }
  const ref=()=>db.ref(CONFIG.nodo+"/asientos");
  const avisar=()=>{ if(!db) guardarLocal(); oyentes.forEach(fn=>fn({...mem})); };
  return {
    conectado:()=>db!==null,
    escuchar(fn){
      oyentes.push(fn);
      if(db) ref().on("value",s=>{mem=s.val()||{};fn({...mem});});
      else { leerLocal(); fn({...mem}); }
      return ()=>{oyentes=oyentes.filter(o=>o!==fn);};
    },
    guardar(id,d){ if(db) return ref().child(id).set(d); mem[id]=d; avisar(); return Promise.resolve(); },

    /* Número de orden corrido y fácil de dictar: CB-001, CB-002, CB-003…
       El contador vive en el servidor y se incrementa con una transacción,
       así dos compras simultáneas nunca reciben el mismo número. */
    async folio(){
      if(!db){ contador++; guardarLocal(); return "CB-"+String(contador).padStart(3,"0"); }
      try{
        const r=await db.ref(CONFIG.nodo+"/contador").transaction(n=>(n||0)+1);
        if(r.committed) return "CB-"+String(r.snapshot.val()).padStart(3,"0");
      }catch(e){}
      return "CB-"+String(Date.now()).slice(-4);   // respaldo si falla el contador
    },

    /* Toma las butacas todo-o-nada. Devuelve la lista de las que ya no estaban libres.
       Con Firebase usa transacciones: la decisión la toma el servidor, no el navegador,
       así que dos personas no pueden ganar la misma butaca. */
    async reservar(ids,datos){
      if(!db){
        const ocupadas=ids.filter(id=>mem[id]);
        if(ocupadas.length) return ocupadas;
        ids.forEach(id=>mem[id]={...datos});
        avisar(); return [];
      }
      const ocupadas=[], tomadas=[];
      for(const id of ids){
        try{
          const r=await ref().child(id).transaction(actual => actual===null ? datos : undefined);
          r.committed ? tomadas.push(id) : ocupadas.push(id);
        }catch(e){ ocupadas.push(id); }
      }
      if(ocupadas.length){   // si falló una sola, se devuelven todas
        await Promise.all(tomadas.map(id=>
          ref().child(id).transaction(a => (a && a.orden===datos.orden) ? null : undefined)));
      }
      return ocupadas;
    },
    varios(obj){
      if(db) return ref().update(obj);
      Object.entries(obj).forEach(([k,v])=>{ v===null?delete mem[k]:mem[k]=v; });
      avisar(); return Promise.resolve();
    },
    borrar(id){ if(db) return ref().child(id).remove(); delete mem[id]; avisar(); return Promise.resolve(); },

    /* Reemplaza el estado completo: sirve para restaurar un respaldo o vaciar las pruebas */
    reemplazar(obj){
      if(db) return ref().set(obj||null);
      mem=obj||{}; avisar(); return Promise.resolve();
    }
  };
})();

  const s=(txt||"").toUpperCase().replace(/[^A-Z0-9]/g,"");

  let base = CONFIG.sitio && CONFIG.sitio.trim();
  if(!base){
    base = /^https?:/.test(location.protocol) ? location.origin + location.pathname : "";
  }
  return base ? `${base.replace(/\/$/,"")}?orden=${id}&k=${clave||""}` : "";
};

const cacheImg={};
const cargarImg=src=>new Promise(res=>{
  if(cacheImg[src]) return res(cacheImg[src]);
  const i=new Image();
  i.onload=()=>{cacheImg[src]=i;res(i);};
  i.onerror=()=>res(null);
  i.src=src;
});

const SERIF = '"Playfair Display", Georgia, "Times New Roman", serif';
const SANS  = 'system-ui, -apple-system, "Segoe UI", sans-serif';

const fuentesListas = (async()=>{
  try{
    await document.fonts.load(`400 120px ${SERIF}`);
    await document.fonts.load(`italic 400 40px ${SERIF}`);
    await document.fonts.ready;
  }catch(e){}
})();

/* Reduce el tamaño hasta que el texto quepa en el ancho disponible */
const ajustar=(x,texto,maxAncho,desde,fuente)=>{
  let t=desde;
  x.font=fuente(t);
  while(x.measureText(texto).width>maxAncho && t>18){ t-=2; x.font=fuente(t); }
  return t;
};
/* Corta con puntos suspensivos si aun así no cabe */
const recortar=(x,texto,maxAncho)=>{
  if(x.measureText(texto).width<=maxAncho) return texto;
  let t=texto;
  while(t.length>4 && x.measureText(t+"…").width>maxAncho) t=t.slice(0,-1);
  return t+"…";
};

async function dibujarBoleto({codigo,fila,num,nombre,precio,orden}){
  await fuentesListas;
  const W=1240,H=560,P=64,corte=W-372;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");

  /* Cielo, igual que la portada */
  const cielo=x.createLinearGradient(0,0,0,H);
  cielo.addColorStop(0,"#0A2050"); cielo.addColorStop(.45,"#06183C"); cielo.addColorStop(1,"#040D22");
  x.fillStyle=cielo; x.fillRect(0,0,W,H);

  const halo=x.createRadialGradient(corte-120,-40,10,corte-120,-40,460);
  halo.addColorStop(0,"rgba(120,180,255,.30)"); halo.addColorStop(1,"rgba(120,180,255,0)");
  x.fillStyle=halo; x.fillRect(0,0,W,H);

  [[150,70,1.6],[300,44,1.1],[520,96,1.3],[640,40,1],[430,180,1],[110,250,1.2],
   [700,150,1.1],[250,330,1],[60,420,1.1],[560,300,1],[790,250,1.2],[380,460,1]]
   .forEach(([sx,sy,r])=>{ x.fillStyle="rgba(255,255,255,.55)"; x.beginPath(); x.arc(sx,sy,r,0,6.284); x.fill(); });

  /* Lucero, el mismo gesto del arte */
  const lx=corte-150, ly=96;
  const brillo=x.createRadialGradient(lx,ly,0,lx,ly,90);
  brillo.addColorStop(0,"rgba(255,255,255,.95)"); brillo.addColorStop(.12,"rgba(190,220,255,.45)");
  brillo.addColorStop(1,"rgba(120,175,255,0)");
  x.fillStyle=brillo; x.beginPath(); x.arc(lx,ly,90,0,6.284); x.fill();
  x.strokeStyle="rgba(255,255,255,.7)"; x.lineWidth=1.5;
  x.beginPath(); x.moveTo(lx,ly-70); x.lineTo(lx,ly+70); x.moveTo(lx-70,ly); x.lineTo(lx+70,ly); x.stroke();

  /* Marco dorado */
  x.strokeStyle="#D8AE5C"; x.lineWidth=3;
  if(x.roundRect){ x.beginPath(); x.roundRect(6,6,W-12,H-12,20); x.stroke(); }
  else x.strokeRect(6,6,W-12,H-12);

  /* Línea de corte con sus muescas */
  x.setLineDash([11,13]); x.strokeStyle="rgba(255,216,77,.5)"; x.lineWidth=2.5;
  x.beginPath(); x.moveTo(corte,26); x.lineTo(corte,H-26); x.stroke();
  x.setLineDash([]);
  x.fillStyle="#040D22";
  [0,H].forEach(y=>{ x.beginPath(); x.arc(corte,y,26,0,6.284); x.fill(); });

  /* Todo el cuerpo del boleto va centrado, como la portada */
  const cx=corte/2, maxT=corte-P*2;
  x.textAlign="center";

  const logo=await cargarImg(LOGO);
  if(logo){ const lh=56, lw=logo.width*(lh/logo.height); x.drawImage(logo,cx-lw/2,46,lw,lh); }

  x.fillStyle="#FFD84D";
  x.font=`italic 400 38px ${SERIF}`;
  x.fillText(CONFIG.evento, cx, 176);

  const etiqueta=`Asiento ${fila}${num}`;
  const tam=ajustar(x,etiqueta,maxT,116,t=>`400 ${t}px ${SERIF}`);
  x.fillStyle="#F2F7FF"; x.fillText(etiqueta, cx, 176+tam+32);

  let y=176+tam+96;
  x.fillStyle="rgba(242,247,255,.9)"; x.font=`300 29px ${SANS}`;
  x.fillText(CONFIG.fecha, cx, y); y+=40;
  x.fillText(`${CONFIG.lugar}, ${CONFIG.ciudad}`, cx, y); y+=46;

  x.fillStyle="rgba(242,247,255,.55)"; x.font=`300 25px ${SANS}`;
  x.fillText(`Lobby ${CONFIG.horaLobby} · Auditorio ${CONFIG.horaAuditorio} · Función ${CONFIG.hora}`, cx, y);
  y+=38;
  x.fillText(recortar(x,`${nombre} · ${L(precio)} · Orden ${orden}`,maxT), cx, y);

  /* Talón: el arpa sobre el QR */
  const qs=236, qx=corte+68, qy=168, cxq=corte+(W-corte)/2;

  const icono=await cargarImg(ICONO);
  if(icono){ const ih=62, iw=icono.width*(ih/icono.height); x.drawImage(icono,cxq-iw/2,64,iw,ih); }

  x.fillStyle="#fff";
  if(x.roundRect){ x.beginPath(); x.roundRect(qx-16,qy-16,qs+32,qs+32,16); x.fill(); }
  else x.fillRect(qx-16,qy-16,qs+32,qs+32);
  const q=document.createElement("canvas");
  new QRious({element:q,value:codigo,size:qs,level:"M",background:"#ffffff",foreground:"#06183C",padding:0});
  x.drawImage(q,qx,qy,qs,qs);

  x.fillStyle="#FFD84D"; x.font=`300 24px ${SANS}`;
  x.fillText(codigo, cxq, qy+qs+58);
  x.fillStyle="rgba(242,247,255,.5)"; x.font=`300 21px ${SANS}`;
  x.fillText("Preséntalo en la entrada", cxq, qy+qs+92);
  x.textAlign="left";

  return c;
}

function QR({texto,size=240}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||typeof QRious==="undefined") return;
    new QRious({element:ref.current,value:texto,size,level:"M",background:"#ffffff",foreground:"#05122E",padding:0});
  },[texto,size]);
  return <canvas ref={ref} />;
}

/* ═══════════════════════════════════════════════════════════
   4 · ESTADO GLOBAL + EXPIRACIÓN AUTOMÁTICA
   ═══════════════════════════════════════════════════════════ */
function useSala(){
  const [asientos,setAsientos]=useState({});
  const [listo,setListo]=useState(false);
  useEffect(()=>Store.escuchar(d=>{setAsientos(d);setListo(true);}),[]);
  useEffect(()=>{
    const barrer=()=>{
      const t=ahora(), fuera={};
      Object.entries(asientos).forEach(([id,a])=>{
        if(a.estado==="apartado"&&a.expira&&a.expira<t) fuera[id]=null;
      });
      if(Object.keys(fuera).length) Store.varios(fuera);
    };
    barrer();
    const i=setInterval(barrer,20000);
    return ()=>clearInterval(i);
  },[asientos]);
  return {asientos,listo};
}

/* Elegir automáticamente los mejores asientos juntos */
function mejoresAsientos(asientos,cantidad){
  for(const f of FILAS){
    const libres=Array.from({length:f.n},(_,i)=>i+1).filter(n=>!asientos[`${f.fila}${n}`]);
    const centro=(f.n+1)/2;
    let mejor=null,dist=1e9;
    for(let s=0;s<=f.n-cantidad;s++){
      const bloque=Array.from({length:cantidad},(_,k)=>s+1+k);
      if(!bloque.every(n=>libres.includes(n))) continue;
      const d=Math.abs((bloque[0]+bloque[cantidad-1])/2-centro);
      if(d<dist){dist=d;mejor=bloque;}
    }
    if(mejor) return mejor.map(n=>`${f.fila}${n}`);
  }
  return null;
}

/* Boleto electrónico con QR */
function Boleto({orden,asientoId,estado,usado,precio}){
  const a=MAPA[asientoId];
  const codigo=`${orden.id}-${asientoId}`;
  const valido = estado==="confirmado";
  const [ocupado,setOcupado]=useState(false);
  const [previa,setPrevia]=useState(null);

  const imagen=async compartir=>{
    setOcupado(true);
    try{
      const lienzo=await dibujarBoleto({codigo,fila:a.fila,num:a.num,nombre:orden.nombre,
                                        precio:precio??precioHoy(),orden:orden.id});
      const blob=await new Promise(r=>lienzo.toBlob(r,"image/png"));
      const archivo=new File([blob],`boleto-${codigo}.png`,{type:"image/png"});

      if(compartir){
        try{
          if(navigator.canShare && navigator.canShare({files:[archivo]})){
            await navigator.share({files:[archivo],title:`Boleto ${codigo}`,
              text:`${CONFIG.evento} · ${CONFIG.fecha} · Fila ${a.fila}, asiento ${a.num}`});
            setOcupado(false); return;
          }
        }catch(e){}
      }
      try{
        const url=URL.createObjectURL(blob);
        const el=document.createElement("a");
        el.href=url; el.download=`boleto-${codigo}.png`;
        document.body.appendChild(el); el.click(); el.remove();
        setTimeout(()=>URL.revokeObjectURL(url),4000);
      }catch(e){}
      setPrevia(lienzo.toDataURL("image/png"));   // siempre queda a la vista por si la descarga se bloquea
    }catch(e){
      setPrevia("error");
    }
    setOcupado(false);
  };

  return (
   <div>
    <div className="boleto">
      <div>
        <div className="tiny">{CONFIG.evento} · {CONFIG.lugar}</div>
        <div className="boleto-asiento">{a.fila}{a.num}</div>
        <div className="meta">Butaca numerada · {L(precio ?? precioHoy())}</div>
        <div className="tiny" style={{marginTop:8}}>{CONFIG.fecha} · Función {CONFIG.hora}</div>
        <div className="tiny">Auditorio abre {CONFIG.horaAuditorio}</div>
        <div className="tiny">{orden.nombre}</div>
      </div>
      <div className="boleto-corte"/>
      <div>
        <div className="boleto-qr"><QR texto={codigo} size={220}/></div>
        <div className="boleto-codigo">{codigo}</div>
      </div>
      {!valido && <div className="sello">Pendiente de pago<br/><span className="tiny">El QR se activa al confirmar</span></div>}
      {usado && <div className="sello">Boleto ya utilizado</div>}
    </div>
    {valido && !usado && (
      <div className="no-print" style={{display:"flex",gap:8,flexWrap:"wrap",margin:"-6px 0 18px"}}>
        <button className="btn-mini" disabled={ocupado} onClick={()=>imagen(true)}>
          {ocupado?"Preparando…":"Compartir este boleto"}
        </button>
        <button className="btn-mini" disabled={ocupado} onClick={()=>imagen(false)}>Guardar imagen</button>
      </div>
    )}
    {previa && (
      <div className="modal no-print" onClick={()=>setPrevia(null)}>
        <div className="modal-caja" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>
          {previa==="error"
            ? <><h3>No se pudo generar la imagen</h3>
                <p>Toma una captura de pantalla del boleto; el código QR funciona igual.</p></>
            : <><h3>Boleto {codigo}</h3>
                <p>Si no se descargó sola, mantén presionada la imagen para guardarla o compartirla.</p>
                <img src={previa} alt={`Boleto ${codigo}`}
                  style={{width:"100%",borderRadius:10,marginTop:14,display:"block"}}/></>}
          <div className="modal-acciones">
            <button className="btn btn-fantasma" onClick={()=>setPrevia(null)}>Cerrar</button>
          </div>
        </div>
      </div>
    )}
   </div>
  );
}

function VistaConsulta({asientos,onAbrir,onVolver}){
  const [dato,setDato]=useState(""),[err,setErr]=useState(""),[lista,setLista]=useState(null);

  const buscar=()=>{
    const t=dato.trim();
    if(t.length<6) return setErr("Escribe el teléfono o el correo completo con el que compraste.");
    const tel=telWa(t), correo=t.toLowerCase();
    const esCorreo=t.includes("@");
    const m={};
    Object.entries(asientos).forEach(([id,a])=>{
      if(!a.orden) return;
      const coincide = esCorreo
        ? (a.correo||"").toLowerCase()===correo
        : telWa(a.telefono)===tel;
      if(coincide) (m[a.orden]||={id:a.orden,clave:a.clave,nombre:a.nombre,telefono:a.telefono,
                                  correo:a.correo,pago:a.pago,tarifa:a.tarifa,estado:a.estado,
                                  expira:a.expira,asientos:[]}).asientos.push(id);
    });
    const r=Object.values(m);
    if(!r.length) return setErr("No encontramos compras con ese dato. Revisa que sea el mismo teléfono o correo que registraste, o escríbenos por WhatsApp.");
    setErr("");
    if(r.length===1) return abrir(r[0]);
    setLista(r);
  };

  const abrir=o=>onAbrir({...o,total:o.asientos.reduce((s,i)=>s+precioSeat(asientos,i),0),
                          expira:o.expira||ahora()});

  return (
    <div className="wrap-sm">
      <div className="topbar"><Logo chico/><button className="btn-txt" onClick={onVolver}>Volver</button></div>
      <div className="seccion">
        <h2 className="serif" style={{fontSize:"1.9rem",marginBottom:6}}>Mis boletos</h2>
        <p className="meta" style={{marginBottom:22}}>
          Busca con el teléfono o el correo que registraste al comprar. Así solo tú puedes abrir tus boletos.
        </p>
        <div className="campo">
          <label htmlFor="d">Teléfono o correo electrónico</label>
          <input id="d" value={dato} autoFocus autoCapitalize="none" autoCorrect="off"
            onChange={e=>{setDato(e.target.value);setErr("");setLista(null);}}
            onKeyDown={e=>e.key==="Enter"&&buscar()} placeholder="9999-9999 o tucorreo@ejemplo.com"/>
        </div>
        {err && <div className="aviso alerta">{err}</div>}

        {lista && (
          <div style={{marginBottom:18}}>
            <p className="meta" style={{marginBottom:10}}>Encontramos varias compras. ¿Cuál quieres abrir?</p>
            {lista.map(o=>(
              <button key={o.id} className="opcion" style={{marginBottom:8}} onClick={()=>abrir(o)}>
                <span>
                  Orden {o.id} · {o.estado}
                  <small>{o.asientos.length} {o.asientos.length===1?"butaca":"butacas"}: {ordena(o.asientos).join(", ")}</small>
                </span>
              </button>
            ))}
          </div>
        )}

        <button className="btn" style={{width:"100%"}} onClick={buscar}>Buscar mis boletos</button>
        <p className="tiny" style={{marginTop:12}}>
          Si compraste con otro número o cambiaste de teléfono, escríbenos por WhatsApp y te ayudamos.
        </p>
      </div>
    </div>
  );
}

function Escaner({asientos,onSalir}){
  const [res,setRes]=useState(null);
  const [manual,setManual]=useState("");
  const [camara,setCamara]=useState(false);
  const lector=useRef(null);

  const validar=codigo=>{
    const c=(codigo||"").trim().toUpperCase();
    const corte=c.lastIndexOf("-");                     // lo último es la butaca
    if(corte<1) return setRes({tipo:"mal",txt:"Código no reconocido."});
    const orden=c.slice(0,corte), asiento=c.slice(corte+1);
    const a=asientos[asiento];
    if(!a||a.orden!==orden) return setRes({tipo:"mal",txt:`Boleto inválido: ${c}`});
    if(a.estado!=="confirmado") return setRes({tipo:"mal",txt:`Asiento ${asiento}: pago no confirmado (${a.estado}).`});
    if(a.usado) return setRes({tipo:"repetido",txt:`Asiento ${asiento} ya fue ingresado a las ${cortaFecha(a.usado)}.`});
    Store.guardar(asiento,{...a,usado:ahora()});
    setRes({tipo:"ok",txt:`Adelante · ${a.nombre} · Fila ${MAPA[asiento].fila}, asiento ${MAPA[asiento].num}`});
  };

  useEffect(()=>{
    if(!camara||typeof Html5Qrcode==="undefined") return;
    const q=new Html5Qrcode("lector");
    lector.current=q;
    q.start({facingMode:"environment"},{fps:10,qrbox:{width:240,height:240}},
      txt=>{validar(txt);},()=>{}).catch(e=>{setCamara(false);setRes({tipo:"mal",txt:"No se pudo abrir la cámara: "+e});});
    return ()=>{ q.stop().then(()=>q.clear()).catch(()=>{}); };
  },[camara]);

  const usados=Object.values(asientos).filter(a=>a.usado).length;
  const vendidos=Object.values(asientos).filter(a=>a.estado==="confirmado").length;

  return (
    <div>
      <div className="stats">
        <div className="stat"><b className="oro">{usados}</b><span>Ingresados</span></div>
        <div className="stat"><b>{vendidos-usados}</b><span>Por llegar</span></div>
        <div className="stat"><b>{vendidos}</b><span>Boletos vendidos</span></div>
      </div>
      {!camara
        ? <button className="btn" onClick={()=>{setRes(null);setCamara(true);}}>Abrir la cámara</button>
        : <button className="btn btn-fantasma" onClick={()=>setCamara(false)}>Cerrar cámara</button>}
      <div id="lector" style={{marginTop:16,display:camara?"block":"none"}}/>
      <div className="campo" style={{marginTop:20}}>
        <label htmlFor="m">O escribe el código del boleto</label>
        <input id="m" value={manual} onChange={e=>setManual(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter"){validar(manual);setManual("");}}}
          placeholder="CB-001-D14" style={{textTransform:"uppercase"}}/>
      </div>
      {res && <div className={"aviso "+(res.tipo==="ok"?"ok":"alerta")} style={{fontSize:"1.05rem"}}>{res.txt}</div>}
      <p className="tiny">Cada boleto se marca como usado la primera vez que se escanea, así nadie entra dos veces con la misma butaca.</p>
    </div>
  );
}

function Admin({asientos,onSalir}){
  const [dialogo,setDialogo]=useState(null);
  const [tab,setTab]=useState("ordenes");
  const [filtro,setFiltro]=useState("todas");
  const [busca,setBusca]=useState("");

  const lista=Object.entries(asientos);
  const cont=e=>lista.filter(([,a])=>a.estado===e).length;
  const stats={apartados:cont("apartado"),confirmados:cont("confirmado"),bloqueados:cont("bloqueado")};
  stats.libres=AFORO-lista.length;
  const ingreso=lista.filter(([,a])=>a.estado==="confirmado").reduce((s,[id])=>s+precioSeat(asientos,id),0);
  const porCobrar=lista.filter(([,a])=>a.estado==="apartado").reduce((s,[id])=>s+precioSeat(asientos,id),0);
  const enPreventaCant=lista.filter(([,a])=>a.estado==="confirmado"&&(a.tarifa||"preventa")==="preventa").length;

  /* Cuenta órdenes por teléfono para señalar posibles compras duplicadas */
  const repetidos=useMemo(()=>{
    const vistos={},c={};
    Object.values(asientos).forEach(a=>{
      if(!a.orden||vistos[a.orden]) return;
      vistos[a.orden]=1;
      const t=telWa(a.telefono); c[t]=(c[t]||0)+1;
    });
    return c;
  },[asientos]);

  const ordenes=useMemo(()=>{
    const m={};
    lista.forEach(([id,a])=>{ if(a.orden) (m[a.orden]||={id:a.orden,...a,asientos:[]}).asientos.push(id); });
    return Object.values(m)
      .filter(o=>filtro==="todas"||o.estado===filtro)
      .filter(o=>!busca||`${o.id} ${o.nombre} ${o.telefono}`.toLowerCase().includes(busca.toLowerCase()))
      .sort((a,b)=>(b.creada||0)-(a.creada||0));
  },[asientos,filtro,busca]);

  const cambiar=(o,estado)=>{
    const c={};
    o.asientos.forEach(id=>{ c[id]= estado===null?null:{...asientos[id],estado,expira:estado==="confirmado"?null:asientos[id].expira}; });
    Store.varios(c);
  };
  const confirmarPago=o=>{
    const t=o.asientos.reduce((s,i)=>s+precioSeat(asientos,i),0);
    const detalle=`un pago de ${L(t)}${o.pago==="tarjeta"?" en BAC ("+o.asientos.length+" boletos)":""}`;
    setDialogo({
      titulo:`Confirmar la orden ${o.id}`,
      texto:`${o.nombre}\n${o.asientos.length} ${o.asientos.length===1?"butaca":"butacas"}: ${ordena(o.asientos).join(", ")}\n\nDebes haber recibido ${detalle}.\n\nAl confirmar se activan los códigos QR de estos boletos.`,
      etiqueta:"Sí, ya verifiqué el pago",
      accion:()=>cambiar(o,"confirmado")
    });
  };
  const liberarOrden=o=>setDialogo({
    titulo:`Liberar la orden ${o.id}`,
    texto:`Las butacas de ${o.nombre} (${ordena(o.asientos).join(", ")}) volverán a estar disponibles y sus boletos dejarán de servir.\n\nEsto no se puede deshacer.`,
    etiqueta:"Liberar las butacas",
    accion:()=>cambiar(o,null)
  });
  const clicAsiento=id=>{
    const a=asientos[id];
    if(!a) return Store.guardar(id,{estado:"bloqueado",nombre:"Cortesía / bloqueo",creada:ahora(),precio:0});
    if(a.estado==="bloqueado") return Store.borrar(id);
    setDialogo({
      titulo:`Butaca ${id}`,
      texto:`${a.nombre}\n${a.estado}${a.orden?" · orden "+a.orden:""}${a.telefono?"\n"+a.telefono:""}${a.usado?"\n\nYa ingresó al teatro a las "+cortaFecha(a.usado):""}`
    });
  };
  const respaldar=()=>{
    const datos=JSON.stringify({evento:CONFIG.nodo,fecha:new Date().toISOString(),asientos},null,1);
    const url=URL.createObjectURL(new Blob([datos],{type:"application/json"}));
    const a=document.createElement("a");
    a.href=url; a.download=`respaldo-belen-${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  const restaurar=ev=>{
    const f=ev.target.files?.[0]; if(!f) return;
    const lector=new FileReader();
    lector.onload=()=>{
      try{
        const d=JSON.parse(lector.result);
        const nuevos=d.asientos||d;
        setDialogo({
          titulo:"Restaurar respaldo",
          texto:`El archivo tiene ${Object.keys(nuevos).length} butacas ocupadas.\n\nEsto reemplaza todo lo que hay ahora mismo en el sistema.`,
          etiqueta:"Restaurar",
          accion:()=>Store.reemplazar(nuevos)
        });
      }catch(e){
        setDialogo({titulo:"No se pudo leer el archivo",texto:"Revisa que sea un respaldo generado por este mismo sistema."});
      }
    };
    lector.readAsText(f);
    ev.target.value="";
  };
  const vaciar=()=>setDialogo({
    titulo:"Borrar todas las órdenes",
    texto:`Se eliminarán las ${Object.keys(asientos).length} butacas ocupadas y el sistema quedará como recién instalado.\n\nÚsalo para limpiar las pruebas antes de abrir la venta real. Descarga un respaldo primero si no estás seguro.`,
    etiqueta:"Borrar todo",
    accion:()=>Store.reemplazar(null)
  });

  const exportar=()=>{
    const r=[["Orden","Nombre","Telefono","Correo","Asientos","Total","Tarifa","Pago","Estado","Creada","Ingresados"]];
    ordenes.forEach(o=>r.push([o.id,o.nombre,o.telefono,o.correo||"",ordena(o.asientos).join(" "),
      o.asientos.reduce((s,i)=>s+precioSeat(asientos,i),0),o.tarifa||"",o.pago,o.estado,o.creada?new Date(o.creada).toLocaleString("es-HN"):"",
      o.asientos.filter(i=>asientos[i]?.usado).length]));
    const csv=r.map(f=>f.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const url=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
    const a=document.createElement("a"); a.href=url; a.download="camino-a-belen-ordenes.csv"; a.click(); URL.revokeObjectURL(url);
  };
  const wa=o=>{
    const t=encodeURIComponent(
      `Hola ${o.nombre}, ¡tus boletos para ${CONFIG.evento} están confirmados!\n\nOrden: ${o.id}\nAsientos: ${ordena(o.asientos).join(", ")}\n${CONFIG.fecha}\n${CONFIG.lugar}\n\n${CONFIG.horaLobby} se abre el lobby\n${CONFIG.horaAuditorio} puertas del auditorio\n${CONFIG.hora} inicia la función${urlOrden(o.id,o.clave) ? "\n\nAbre tus boletos con código QR aquí:\n"+urlOrden(o.id,o.clave) : "\n\nAbre tus boletos en “Mis boletos” de nuestra página, con el teléfono o el correo que registraste."}\n\n¡Nos vemos!`);
    window.open(`https://wa.me/${telWa(o.telefono)}?text=${t}`,"_blank");
  };

  return (
    <div className="wrap">
      <Dialogo datos={dialogo} onCerrar={()=>setDialogo(null)}/>
      <div className="topbar">
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <Logo chico/>
          <span className="tiny">{Store.conectado()?"Sincronizado":"Modo local"}</span>
          {!CONFIG.pedirClave &&
            <span className="tiny" style={{color:"var(--alerta)"}}>· Panel sin contraseña</span>}
        </div>
        <button className="btn-txt" onClick={onSalir}>Salir</button>
      </div>
      <div className="seccion">
        <div className="stats">
          <div className="stat"><b>{stats.libres}</b><span>Disponibles</span></div>
          <div className="stat"><b style={{color:"#FFC97A"}}>{stats.apartados}</b><span>Apartados</span></div>
          <div className="stat"><b style={{color:"var(--ok)"}}>{stats.confirmados}</b><span>Confirmados</span></div>
          <div className="stat"><b className="oro">{L(ingreso)}</b><span>Ingreso confirmado</span></div>
          <div className="stat"><b>{L(porCobrar)}</b><span>Por cobrar</span></div>
          <div className="stat"><b>{enPreventaCant} / {stats.confirmados-enPreventaCant}</b><span>Preventa / regular</span></div>
        </div>
        <p className="tiny" style={{margin:"-14px 0 22px"}}>
          Tarifa vigente hoy: {L(precioHoy())} ({enPreventa()?`preventa, ${diasPreventa()} días restantes`:"precio regular"}).
        </p>
        <div className="tabs">
          {[["ordenes","Órdenes"],["sala","Mapa de sala"],["puerta","Entrada del teatro"]].map(([k,n])=>(
            <button key={k} className={"tab "+(tab===k?"activo":"")} onClick={()=>setTab(k)}>{n}</button>
          ))}
        </div>

        {tab==="ordenes" && (
          <>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16,alignItems:"center"}}>
              {[["todas","Todas"],["apartado","Apartadas"],["confirmado","Confirmadas"]].map(([k,n])=>(
                <button key={k} className={"btn-mini "+(filtro===k?"on":"")} onClick={()=>setFiltro(k)}>{n}</button>
              ))}
              <button className="btn-mini" onClick={exportar}>Descargar CSV</button>
              <button className="btn-mini" onClick={respaldar}>Respaldo</button>
              <label className="btn-mini" style={{cursor:"pointer"}}>
                Restaurar
                <input type="file" accept="application/json" onChange={restaurar} style={{display:"none"}}/>
              </label>
              <button className="btn-mini" style={{color:"var(--alerta)",borderColor:"rgba(255,138,107,.4)"}}
                onClick={vaciar}>Vaciar</button>
              <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar nombre, teléfono u orden"
                style={{flex:"1 1 200px",padding:"7px 14px",borderRadius:100,background:"rgba(255,255,255,.06)",
                        border:"1px solid var(--borde)",color:"var(--blanco)",fontFamily:"inherit",fontWeight:300}}/>
            </div>
            {ordenes.length===0
              ? <div className="vacio">Todavía no hay órdenes que mostrar.</div>
              : <table className="tabla">
                  <thead>
                    <tr>
                      <th>Orden</th><th>Nombre</th><th>Teléfono</th><th>Butacas</th>
                      <th className="num">Total</th><th>Pago</th><th>Estado</th><th className="num">Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                  {ordenes.map(o=>{
                    const t=o.asientos.reduce((s,i)=>s+precioSeat(asientos,i),0);
                    const butacas=ordena(o.asientos);
                    const dentro=butacas.filter(i=>asientos[i]?.usado).length;
                    const dup=repetidos[telWa(o.telefono)]>1;
                    return (
                      <tr key={o.id}>
                        <td data-l="Orden"><span className="mono">{o.id}</span></td>
                        <td data-l="Nombre" title={o.correo||""}>{o.nombre}</td>
                        <td data-l="Teléfono">
                          {o.telefono}
                          {dup && <span className="dup" title="Este teléfono tiene varias órdenes. Verifica que no sea una compra duplicada.">!</span>}
                        </td>
                        <td data-l="Butacas" title={butacas.join(", ")}>
                          <span className={dentro?"ok-txt":""}>
                            {butacas.length<=3 ? butacas.join(", ") : `${butacas.slice(0,2).join(", ")} +${butacas.length-2}`}
                          </span>
                          {dentro>0 && <span className="tiny"> · {dentro}/{butacas.length} adentro</span>}
                        </td>
                        <td data-l="Total" className="num">{L(t)}</td>
                        <td data-l="Pago" className="tenue">{o.pago}<br/><span className="tiny">{o.tarifa}</span></td>
                        <td data-l="Estado">
                          <span className={"etiqueta "+(o.estado==="confirmado"?"et-confirmado":"et-apartado")}>
                            {o.estado==="confirmado"?"pagado":"apartado"}
                          </span>
                          {o.estado==="apartado"&&o.expira &&
                            <div className="tiny">vence {cortaFecha(o.expira)}</div>}
                        </td>
                        <td data-l="Acciones">
                          <div className="acc">
                            {o.estado==="confirmado"
                              ? <span className="enlace apagado" title="Esta orden ya está pagada">Confirmar</span>
                              : <button className="enlace oro" onClick={()=>confirmarPago(o)}>Confirmar</button>}
                            <button className="enlace verde" onClick={()=>wa(o)}>WhatsApp</button>
                            <button className="enlace rojo" onClick={()=>liberarOrden(o)}>Liberar</button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                  </tbody>
                </table>}
          </>
        )}

        {tab==="sala" && (
          <>
            <p className="meta" style={{marginBottom:16}}>
              Toca una butaca libre para bloquearla (cortesías, patrocinadores, prensa). Toca una bloqueada para liberarla.
              Las ocupadas muestran a quién pertenecen.
            </p>
            <Sala asientos={asientos} seleccion={[]} onAsiento={clicAsiento} admin/>
          </>
        )}

        {tab==="puerta" && <Escaner asientos={asientos}/>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   8 · APP
   ═══════════════════════════════════════════════════════════ */
function App(){
  const {asientos,listo}=useSala();
  const [vista,setVista]=useState("inicio");
  const [seleccion,setSeleccion]=useState([]);
  const [orden,setOrden]=useState(null);
  const [admin,setAdmin]=useState(false);
  const [procesando,setProcesando]=useState(false);
  const [choque,setChoque]=useState(null);

  useEffect(()=>{window.scrollTo(0,0);},[vista]);

  // ?orden=CBXXXXX abre los boletos directo desde el link de WhatsApp
  useEffect(()=>{
    if(!listo||orden) return;
    const q=new URLSearchParams(location.search);
    const p=q.get("orden"); if(!p) return;
    const id=normOrden(p), k=(q.get("k")||"").toUpperCase();
    const ids=Object.entries(asientos).filter(([,a])=>a.orden===id).map(([s])=>s);
    if(!ids.length) return;
    const a=asientos[ids[0]];
    if(a.clave && a.clave!==k) return;   // sin la clave correcta el enlace no abre nada
    setOrden({id,clave:a.clave,nombre:a.nombre,telefono:a.telefono,correo:a.correo,pago:a.pago,tarifa:a.tarifa,
              asientos:ids,total:ids.reduce((s,i)=>s+precioSeat(asientos,i),0),expira:a.expira||ahora()});
    setVista("orden");
  },[listo,asientos]);

  const libres=AFORO-Object.keys(asientos).length;

  /* Órdenes activas del mismo teléfono o correo, para avisar antes de repetir compra */
  const buscarPrevias=(telefono,correo)=>{
    const t=telWa(telefono), c=(correo||"").trim().toLowerCase();
    const m={};
    Object.entries(asientos).forEach(([id,a])=>{
      if(!a.orden) return;
      const mismo = telWa(a.telefono)===t || (c && (a.correo||"").toLowerCase()===c);
      if(mismo && (a.estado==="apartado"||a.estado==="confirmado"))
        (m[a.orden]||={id:a.orden,estado:a.estado,asientos:[]}).asientos.push(id);
    });
    return Object.values(m);
  };

  const apartar=async datos=>{
    if(procesando) return;
    setProcesando(true);
    const id=await Store.folio();
    const expira=ahora()+CONFIG.expiracion[datos.pago]*60000;
    const tarifa=tarifaHoy(), precio=precioHoy();
    const clave=nuevaClave();
    const registro={estado:"apartado",orden:id,clave,nombre:datos.nombre.trim(),telefono:datos.telefono,
                    correo:datos.correo.trim(),pago:datos.pago,tarifa,precio,creada:ahora(),expira};
    const ocupadas=await Store.reservar(ordena(seleccion),registro);
    setProcesando(false);
    if(ocupadas.length){
      setChoque(ordena(ocupadas));
      setSeleccion(s=>s.filter(x=>!ocupadas.includes(x)));
      return setVista("mapa");
    }
    setOrden({id,clave,...datos,tarifa,precio,asientos:ordena(seleccion),total:seleccion.length*precio,expira});
    setSeleccion([]); setVista("orden");
  };

  if(!listo) return <div className="wrap" style={{padding:"90px 22px"}}><p className="meta">Preparando la sala…</p></div>;
  if(admin==="login" && CONFIG.pedirClave)
    return <Login onEntrar={()=>setAdmin(true)} onSalir={()=>setAdmin(false)}/>;
  if(admin==="login") return <Admin asientos={asientos} onSalir={()=>setAdmin(false)}/>;
  if(admin===true) return <Admin asientos={asientos} onSalir={()=>setAdmin(false)}/>;

  const conWa = (contenido,texto) => <>{contenido}<BotonWhatsApp texto={texto}/></>;

  if(vista==="inicio") return conWa(
    <Inicio libres={libres} onEmpezar={()=>setVista("mapa")}
      onAdmin={()=>setAdmin("login")} onConsultar={()=>setVista("consulta")}/>,
    `Hola, tengo una consulta sobre los boletos de ${CONFIG.evento}.`);
  if(vista==="mapa") return <VistaMapa asientos={asientos} seleccion={seleccion} setSeleccion={setSeleccion}
                              choque={choque} limpiarChoque={()=>setChoque(null)}
                              onSeguir={()=>setVista("datos")} onVolver={()=>setVista("inicio")}/>;
  if(vista==="datos") return conWa(
    <VistaDatos seleccion={seleccion} onVolver={()=>setVista("mapa")}
      onApartar={apartar} buscarPrevias={buscarPrevias} procesando={procesando}/>,
    `Hola, necesito ayuda para completar mi compra de ${CONFIG.evento}.`);
  if(vista==="consulta") return conWa(
    <VistaConsulta asientos={asientos} onVolver={()=>setVista("inicio")}
      onAbrir={o=>{setOrden(o);setVista("orden");}}/>,
    `Hola, no encuentro mis boletos de ${CONFIG.evento}. ¿Me ayudan a buscarlos?`);
  if(vista==="orden") return <VistaOrden orden={orden} asientos={asientos}
                               onInicio={()=>setVista("inicio")} onSeguirComprando={()=>{setOrden(null);setVista("mapa");}}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
